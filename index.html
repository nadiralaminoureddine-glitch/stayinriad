let LANG="fr";
const $=id=>document.getElementById(id);
const t=k=>(T[LANG]&&T[LANG][k])||T.fr[k]||k;
const cityName=c=>(CITY_TR[c]&&CITY_TR[c][LANG])||c;
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),3200);}

/* ==== Langue selon la localisation (fuseau horaire + langue du téléphone) ==== */
const TZ={"Africa/Casablanca":"MA","Africa/El_Aaiun":"MA","Europe/Paris":"fr","Europe/Brussels":"fr","Europe/Luxembourg":"fr","Europe/Monaco":"fr","Europe/Zurich":"fr","America/Montreal":"fr","Africa/Algiers":"fr","Africa/Tunis":"fr","Africa/Dakar":"fr","Africa/Abidjan":"fr",
 "Europe/Madrid":"es","Atlantic/Canary":"es","Africa/Ceuta":"es","America/Mexico_City":"es","America/Bogota":"es","America/Lima":"es","America/Santiago":"es","America/Argentina/Buenos_Aires":"es","America/Caracas":"es","America/Montevideo":"es",
 "Asia/Riyadh":"ar","Asia/Dubai":"ar","Asia/Qatar":"ar","Asia/Kuwait":"ar","Asia/Bahrain":"ar","Asia/Muscat":"ar","Africa/Cairo":"ar","Asia/Amman":"ar","Asia/Beirut":"ar","Asia/Baghdad":"ar","Africa/Tripoli":"ar","Africa/Nouakchott":"ar"};
function detect(){let s=null;try{s=localStorage.getItem("sir_lang");}catch(e){}if(s&&T[s])return{l:s,auto:false};
  const nav=(navigator.languages&&navigator.languages[0]||navigator.language||"fr").slice(0,2).toLowerCase();let tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(e){}
  const z=TZ[tz];const l=z==="MA"?(["ar","en","es"].includes(nav)?nav:"fr"):z?z:(T[nav]?nav:"en");return{l,auto:true};}
function setLang(l,manual){LANG=T[l]?l:"fr";if(manual){try{localStorage.setItem("sir_lang",LANG);}catch(e){}$("langNote").innerHTML="";}
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==="ar"?"rtl":"ltr";$("langSel").value=LANG;
  document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
  $("cities").innerHTML=CITIES.map((c,i)=>`<div class="city">${patio(i)}<b>${cityName(c)}</b></div>`).join("");
  const v=$("fCity").value;$("fCity").innerHTML=["Marrakech","Fès","Essaouira","Chefchaouen","Tanger","Tétouan","Rabat","Meknès","Agadir","Ouarzazate","Merzouga","Autre"].map(c=>`<option value="${c}">${cityName(c)}</option>`).join("");if(v)$("fCity").value=v;
  $("ftContact").innerHTML=[CONFIG.email?`✉️ <a href="mailto:${CONFIG.email}" dir="ltr">${CONFIG.email}</a>`:"",CONFIG.whatsapp?`💬 <a href="https://wa.me/${CONFIG.whatsapp}" dir="ltr">+${CONFIG.whatsapp}</a>`:""].filter(Boolean).join("<br>")||t("no_contact");
  $("sendWa").style.display=CONFIG.whatsapp?"":"none";$("sendMail").style.display=CONFIG.email?"":"none";
  if(!CONFIG.whatsapp&&!CONFIG.email)$("fErr").textContent=t("no_contact");
  document.title="StayInRiad — "+t("badge");}
$("langSel").onchange=e=>setLang(e.target.value,true);

/* ==== Formulaires (sans serveur : ouvre WhatsApp ou la messagerie) ==== */
function partnerText(){const f={riad:$("fRiad").value.trim(),city:$("fCity").value,name:$("fName").value.trim(),rooms:$("fRooms").value.trim(),phone:$("fPhone").value.trim(),email:$("fEmail").value.trim(),msg:$("fMsg").value.trim()};
  if(!f.riad||!f.name||!f.phone){$("fErr").textContent=t("f_err");return null;}$("fErr").textContent="";
  return [t("wa_intro"),"",`${t("l_riad")} : ${f.riad}`,`${t("l_city")} : ${cityName(f.city)}`,`${t("l_name")} : ${f.name}`,f.rooms?`${t("l_rooms")} : ${f.rooms}`:"",`${t("l_phone")} : ${f.phone}`,f.email?`${t("l_email")} : ${f.email}`:"",f.msg?`${t("l_msg")} : ${f.msg}`:""].filter((x,i)=>i===1||x).join("\n");}
$("sendWa").onclick=()=>{const txt=partnerText();if(!txt)return;location.href=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}`;};
$("sendMail").onclick=()=>{const txt=partnerText();if(!txt)return;location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent(t("mail_subj")+" — "+$("fRiad").value.trim())}&body=${encodeURIComponent(txt)}`;};
$("tForm").onsubmit=e=>{e.preventDefault();const m=$("tEmail").value.trim();if(!/^\S+@\S+\.\S+$/.test(m)){toast(t("t_err"));return;}
  if(!CONFIG.email){toast(t("no_contact"));return;}location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent(t("wait_subj"))}&body=${encodeURIComponent(t("wait_body")+" "+m)}`;};

/* ==== Démarrage ==== */
$("yr").textContent=new Date().getFullYear();
const D=detect();setLang(D.l,false);
if(D.auto)$("langNote").innerHTML=`🌐 ${t("lang_auto")} · <a href="#" style="color:var(--gold)" onclick="$('langSel').focus();if($('langSel').showPicker)$('langSel').showPicker();return false">${t("lang_change")}</a>`;
</script>
